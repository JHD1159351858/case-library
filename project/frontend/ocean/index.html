<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8cb5ce">
  <meta name="description" content="A moment of stillness. An endless sense of possibility. Scroll from the ocean surface into the blue.">
  <title>OCEAN — Closer to the ocean.</title>
  <link rel="icon" href="./assets/ocean.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/bodoni-moda.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./assets/surface.jpg" as="image">
  <link rel="stylesheet" href="../desktop-layout.css">
  <link rel="stylesheet" href="./ocean.css">
  <script type="module" src="./ocean.js"></script>
</head>
<body>
  <main class="ocean-experience" aria-label="An ocean journey">
    <div class="ocean-stage" id="ocean-stage">
      <div class="ocean-background" aria-hidden="true">
        <img class="background-surface" src="./assets/surface.jpg" alt="" fetchpriority="high">
        <img class="background-underwater" src="./assets/underwater.jpg" alt="">
        <canvas id="ocean-canvas"></canvas>
      </div>

      <div class="page-overlay" id="page-overlay">
        <button class="announcement" type="button" data-depth="0.92">
          A new perspective begins here. <span aria-hidden="true">→</span>
        </button>

        <header class="site-header">
          <a class="brand" href="#surface" aria-label="OCEAN — return to the surface" data-depth="0">
            <svg viewBox="0 0 84 28" aria-hidden="true"><path d="M1 19C16 20 23 3 38 7c14 4 20 21 44 8C62 28 52 19 39 15 25 11 17 23 1 19Z"/><path d="M21 10C36-4 48 1 64 10 44 5 37 4 21 10Z"/></svg>
            <span>OCEAN</span>
          </a>
          <nav class="desktop-nav" aria-label="Main navigation">
            <button type="button" data-depth="0.84">Discover</button>
            <button type="button" data-panel="story">Our story</button>
            <button type="button" data-panel="journal">Journal</button>
          </nav>
          <button class="outline-button header-explore" type="button" data-depth="1">Explore now <span aria-hidden="true">↗</span></button>
          <button class="menu-button" type="button" aria-label="Open navigation" aria-controls="mobile-navigation" aria-expanded="false"><span></span><span></span></button>
          <nav class="mobile-nav" id="mobile-navigation" aria-label="Mobile navigation" hidden>
            <button type="button" data-depth="0.84">Discover <span aria-hidden="true">↘</span></button>
            <button type="button" data-panel="story">Our story <span aria-hidden="true">↗</span></button>
            <button type="button" data-panel="journal">Journal <span aria-hidden="true">↗</span></button>
          </nav>
        </header>

        <section class="hero-copy" aria-labelledby="hero-title">
          <p class="eyebrow">Feel the world slow down</p>
          <h1 id="hero-title">Closer to<br>the ocean.</h1>
          <p class="hero-description">A moment of stillness.<br>An endless sense of possibility.</p>
          <div class="hero-actions">
            <button class="primary-button" type="button" data-depth="1">Explore the ocean <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
            <button class="film-button" id="watch-film" type="button"><span class="play-circle"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6Z"/></svg></span><span>Watch the film</span></button>
          </div>
        </section>

        <footer class="scene-footer">
          <button class="motion-button" id="toggle-motion" type="button" aria-label="Pause ocean animation" aria-pressed="false">
            <span class="motion-circle"><svg class="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg><svg class="resume-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6Z"/></svg></span>
            <span id="motion-label">Live at sea</span>
          </button>
          <button class="scroll-button" id="scroll-cue" type="button" data-depth="1"><span id="scroll-label">Scroll to explore</span><svg viewBox="0 0 20 24" aria-hidden="true"><path d="M10 2v19M4 14l6 7 6-7M7 11l3 3 3-3"/></svg></button>
        </footer>
      </div>
    </div>
    <div class="scroll-distance" aria-hidden="true"></div>
  </main>

  <dialog class="reference-dialog" id="reference-dialog" aria-labelledby="panel-title">
    <button class="dialog-close" type="button" data-close-dialog aria-label="Close panel">×</button>
    <p class="eyebrow">OCEAN</p>
    <h2 id="panel-title">Our story</h2>
    <p id="panel-copy"></p>
    <button class="primary-button" type="button" data-close-dialog>Back to the ocean <span aria-hidden="true">↗</span></button>
  </dialog>

  <dialog class="film-dialog" id="film-dialog" aria-label="An ocean journey, rendered in the browser">
    <button class="film-close" type="button" aria-label="Close film">Close <span aria-hidden="true">×</span></button>
    <div class="film-caption"><p class="eyebrow">A moment of stillness</p><h2>Just you.<br>And the blue.</h2><p class="film-note">An ocean study · Scroll to take control</p></div>
    <div class="film-bottom"><button class="film-pause" type="button" aria-label="Pause cinematic journey">Pause journey <span aria-hidden="true">Ⅱ</span></button><span class="film-time" aria-hidden="true">00:00 / 00:20</span></div>
    <div class="film-progress" aria-hidden="true"><span></span></div>
  </dialog>
  <noscript><p class="noscript-message">Enable JavaScript to explore below the surface.</p></noscript>
</body>
</html>
